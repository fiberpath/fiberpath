# Policy: High/Critical vulnerabilities block; everything else is reported but
# does not block. Full tree (dev + build deps) is in scope. Python is
# deliberately stricter (any advisory blocks) because pip-audit cannot tier by
# severity. Allowlist mechanics, rationale, and the accepted-advisory record
# live in docs/development/dependency-policy.md ("CI audit gating").
name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: Python Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          dependencies: ".[dev,api,cli,plot]"

      - name: Export requirements for audit
        run: uv export --all-extras --no-hashes --format requirements-txt -o requirements-audit.txt

      - name: Run pip-audit (blocks on any advisory)
        # pip-audit has no severity filter, so any advisory fails this step —
        # the deliberate policy for Python. To accept a triaged advisory, add
        # `--ignore-vuln <ID>` here AND record the reasoning in
        # docs/development/dependency-policy.md.
        run: uvx --with pip-audit pip-audit -r requirements-audit.txt --format json --output pip-audit.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 30

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiberpath_gui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node

      - name: Run npm audit (JSON report)
        # npm has no per-advisory ignore, so its exit code cannot accept a
        # triaged advisory. Capture the report and let the gate below decide.
        # `|| true` here is safe *because* the gate fails closed on a missing or
        # malformed report (a genuine tool/network error).
        run: npm audit --json > npm-audit.json || true

      - name: Enforce high/critical gate
        # To accept a triaged high/critical, add `--ignore <GHSA-ID>` here AND
        # record the reasoning in docs/development/dependency-policy.md.
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/ci/npm_audit_gate.py" npm-audit.json
          --ignore GHSA-vfj7-8cjw-p6xm

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: fiberpath_gui/npm-audit.json
          retention-days: 30

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiberpath_gui/src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust
        with:
          install-linux-deps: "false"

      - name: Install cargo-audit
        run: cargo audit --version 2>/dev/null || cargo install cargo-audit --locked

      - name: Run cargo audit (JSON report)
        # cargo audit exits non-zero whenever it finds advisories (vulnerabilities
        # OR informational warnings), so its exit code cannot gate on severity.
        # Capture the report and let the CVSS gate below decide. `|| true` here is
        # safe *because* the gate re-parses the report and fails closed if it is
        # missing or malformed (a genuine tool/network error) — see the gate step.
        run: cargo audit --json > cargo-audit.json || true

      - name: Enforce CVSS >= 7.0 gate
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/cargo_audit_gate.py" cargo-audit.json

      - name: Upload cargo audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-report
          path: fiberpath_gui/src-tauri/cargo-audit.json
          retention-days: 30
