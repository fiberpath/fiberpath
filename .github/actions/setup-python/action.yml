name: Setup Python Environment
description: Sets up Python with uv and installs dependencies

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.11"
  dependencies:
    description: Dependency groups to install (e.g., ".[dev,api]")
    required: false
    default: ".[dev,api]"
  cache-key-suffix:
    description: Additional suffix for cache key
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Cache Python virtual environment
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ inputs.cache-key-suffix }}
        restore-keys: |
          venv-${{ runner.os }}-${{ inputs.python-version }}-

    - name: Create virtual environment
      shell: bash
      run: |
        # A restored cache can hold a .venv whose interpreter symlink is broken
        # (hosted-Python patch bump or setup-uv install-dir change), which makes
        # the next `uv pip install` fail. Trust the cache only if the interpreter
        # actually runs; otherwise recreate it.
        if [ -x ".venv/bin/python" ] && .venv/bin/python -c "" 2>/dev/null; then
          echo "Using restored .venv from cache"
        else
          echo "No usable cached venv (missing or broken interpreter); recreating"
          rm -rf .venv
          uv venv
        fi

    - name: Install dependencies
      shell: bash
      run: uv pip install ${{ inputs.dependencies }}
